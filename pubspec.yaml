name: azulremote
description: "AzulRemote"
publish_to: 'none'
version: 1.0.10+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  http: ^1.6.0
  crypto: ^3.0.7
  web_socket_channel: ^3.0.2
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.3.0
  open_filex: ^4.6.0
  path_provider: ^2.1.5
  record: ^7.0.0
  audioplayers: ^6.4.0
  ffi: ^2.1.3
  image: ^4.3.0

dependency_overrides:
  objective_c: 9.4.1
  path_provider_foundation: 2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - logo.png
